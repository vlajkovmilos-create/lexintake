<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontrolna tabla — LexIntake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #f5f0e8;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  nav {
    background: #0f2744;
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: #f5f0e8;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .nav-logo svg {
    width: 18px;
    height: 18px;
    stroke: #c9a84c;
    fill: none;
    stroke-width: 1.5;
  }

  .nav-info {
    font-size: 13px;
    color: rgba(245,240,232,0.5);
  }

  /* SADRZAJ */
  .sadrzaj {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  .statistike {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }

  .stat-kartica {
    background: #ffffff;
    border: 1px solid rgba(15,39,68,0.1);
    border-radius: 12px;
    padding: 20px;
  }

  .stat-oznaka {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #8a8070;
    margin-bottom: 8px;
  }

  .stat-vrednost {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 500;
    color: #0f2744;
  }

  .stat-delta {
    font-size: 12px;
    color: #16a34a;
    margin-top: 3px;
  }

  /* TABELA */
  .tabela-kartica {
    background: #ffffff;
    border: 1px solid rgba(15,39,68,0.1);
    border-radius: 12px;
    overflow: hidden;
  }

  .tabela-zaglavlje {
    padding: 18px 24px;
    border-bottom: 1px solid rgba(15,39,68,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .tabela-naslov {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 500;
    color: #0f2744;
  }

  .tabela-broj {
    font-size: 13px;
    color: #8a8070;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    padding: 10px 20px;
    text-align: left;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #8a8070;
    background: #fafaf8;
    border-bottom: 1px solid rgba(15,39,68,0.08);
  }

  tbody tr {
    border-bottom: 1px solid rgba(15,39,68,0.06);
    transition: background 0.12s;
    cursor: pointer;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafaf8; }

  tbody td {
    padding: 14px 20px;
    font-size: 14px;
    color: #3d3830;
    vertical-align: middle;
  }

  .klijent-ime {
    font-weight: 500;
    color: #1a1610;
    display: block;
  }

  .klijent-kontakt {
    font-size: 12px;
    color: #8a8070;
    margin-top: 2px;
    display: block;
  }

  .oznaka-status {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    display: inline-block;
  }

  .status-novi { background: #e8f0fb; color: #0c447c; }
  .status-na_pregledu { background: #fef3c7; color: #92400e; }
  .status-zakazano { background: #dcfce7; color: #166534; }
  .status-zatvoreno { background: #f3f4f6; color: #6b7280; }

  .oznaka-urgentnost {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    display: inline-block;
  }

  .urgentnost-visoka { background: #fee2e2; color: #991b1b; }
  .urgentnost-srednja { background: #fef3c7; color: #92400e; }
  .urgentnost-niska { background: #dcfce7; color: #166534; }

  .dugme-pregled {
    font-size: 12px;
    color: #0f2744;
    border: 1px solid rgba(15,39,68,0.25);
    border-radius: 6px;
    padding: 5px 12px;
    background: transparent;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.12s;
  }
  .dugme-pregled:hover { background: #f0f4f8; }

  .prazno {
    padding: 64px 24px;
    text-align: center;
    color: #8a8070;
  }
  .prazno svg {
    width: 40px;
    height: 40px;
    stroke: #ede7d9;
    fill: none;
    stroke-width: 1.2;
    margin-bottom: 16px;
  }
  .prazno p { font-size: 14px; font-weight: 300; }

  .modal-pozadina {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,39,68,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-pozadina.vidljivo { display: flex; }

  .modal {
    background: #ffffff;
    border-radius: 14px;
    width: 100%;
    max-width: 620px;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(15,39,68,0.2);
  }

  .modal-zaglavlje {
    padding: 20px 24px;
    border-bottom: 1px solid rgba(15,39,68,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: #ffffff;
    z-index: 1;
  }

  .modal-naslov {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 500;
    color: #0f2744;
  }

  .dugme-zatvori {
    width: 32px;
    height: 32px;
    background: #f5f0e8;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s;
  }
  .dugme-zatvori:hover { background: #ede7d9; }
  .dugme-zatvori svg {
    width: 14px;
    height: 14px;
    stroke: #3d3830;
    fill: none;
    stroke-width: 2;
  }

  .modal-telo { padding: 24px; }

  .sekcija-oznaka {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #8a8070;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(15,39,68,0.08);
  }

  .polje-red {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .polje {
    background: #fafaf8;
    border-radius: 8px;
    padding: 10px 14px;
  }

  .polje-oznaka {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #8a8070;
    font-weight: 500;
    display: block;
    margin-bottom: 3px;
  }

  .polje-vrednost {
    font-size: 14px;
    color: #1a1610;
    line-height: 1.5;
  }

  .polje.puno { grid-column: 1 / -1; }

  .ai-blok {
    background: #eef3f8;
    border-left: 3px solid #0f2744;
    border-radius: 0 8px 8px 0;
    padding: 14px 16px;
    font-size: 14px;
    color: #0f2744;
    line-height: 1.7;
    margin-bottom: 10px;
  }

  .urgentnost-traka {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
  }

  .traka-oznaka { font-size: 12px; color: #8a8070; }
  .traka-pozadina {
    flex: 1;
    height: 5px;
    background: rgba(15,39,68,0.08);
    border-radius: 3px;
    overflow: hidden;
  }
  .traka-punjenje {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, #22c55e, #f59e0b, #ef4444);
  }
  .traka-vrednost { font-size: 12px; font-weight: 500; }
  .traka-visoka { color: #991b1b; }
  .traka-srednja { color: #92400e; }
  .traka-niska { color: #166534; }

  .sekcija-razmak { margin-bottom: 20px; }

  .status-izbornik {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid rgba(15,39,68,0.15);
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    color: #1a1610;
    background: #fafaf8;
    outline: none;
    cursor: pointer;
    margin-top: 10px;
  }

  .dugme-sacuvaj {
    width: 100%;
    padding: 12px;
    background: #0f2744;
    color: #f5f0e8;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    margin-top: 12px;
    transition: background 0.15s;
  }
  .dugme-sacuvaj:hover { background: #1a3a5c; }

  .dugme-pdf {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: #0f2744;
    border: 1px solid rgba(15,39,68,0.25);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

  .dugme-pdf:hover { background: #f0f4f8; }

  .ucitavanje {
    text-align: center;
    padding: 48px;
    color: #8a8070;
    font-size: 14px;
  }
  /* Traka pretplate */
  .traka-pretplate {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    background: #fef3c7;
    border: 1px solid #fcd34d;
    color: #78350f;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .traka-pretplate.vidljivo { display: flex; }
  .traka-pretplate.istekla { background: #fee2e2; border-color: #fca5a5; color: #7f1d1d; }
  .traka-pretplate a {
    background: #0f2744;
    color: #f5f0e8;
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12px;
    white-space: nowrap;
  }
  .oznaka-analiza { font-size: 11px; color: #8a8070; font-style: italic; }
  .dugme-odjava {
    background: none;
    border: none;
    font-size: 13px;
    color: rgba(245,240,232,0.5);
    cursor: pointer;
    font-family: inherit;
  }
  .dugme-odjava:hover { color: rgba(245,240,232,0.9); }
  .ai-napomena { font-size: 11px; color: #8a8070; margin-top: 6px; }
  .transkript { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; padding: 12px; background: #fafaf8; border-radius: 8px; }
  .transkript-poruka { font-size: 13px; line-height: 1.5; padding: 8px 12px; border-radius: 8px; max-width: 88%; }
  .transkript-poruka.assistant { background: #fff; border: 1px solid rgba(15,39,68,0.1); align-self: flex-start; }
  .transkript-poruka.user { background: #0f2744; color: rgba(255,255,255,0.9); align-self: flex-end; }
  details.sekcija-razmak summary { cursor: pointer; }
  .dugme-obrisi {
    display: block;
    margin-top: 14px;
    background: none;
    border: none;
    color: #b91c1c;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
  }
  .dugme-obrisi:hover { text-decoration: underline; }

  @media (max-width: 720px) {
    nav { padding: 0 16px; }
    .sadrzaj { padding: 20px 16px; }
    .statistike { grid-template-columns: repeat(2, 1fr); }
    #tabelaSadrzaj { overflow-x: auto; }
    .polje-red { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">
    <svg viewBox="0 0 24 24"><path d="M12 3L4 7v5c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V7l-8-4z"/></svg>
    LexIntake
  </div>
  <div class="nav-desno" style="display:flex;align-items:center;gap:20px;">
  <span style="font-size:13px;color:rgba(245,240,232,0.6);" id="navInfo"></span>
  <a href="podesavanja.html" style="font-size:13px;color:rgba(245,240,232,0.5);text-decoration:none;transition:color 0.15s;" onmouseover="this.style.color='rgba(245,240,232,0.9)'" onmouseout="this.style.color='rgba(245,240,232,0.5)'">Podešavanja</a>
  <button class="dugme-odjava" onclick="odjava()">Odjava</button>
  </div>
</nav>

<div class="sadrzaj">

  <div class="traka-pretplate" id="trakaPretplate">
    <span id="trakaTekst"></span>
    <a href="podesavanja.html#pretplata">Izaberite plan</a>
  </div>

  <!-- Statistike -->
  <div class="statistike">
    <div class="stat-kartica">
      <div class="stat-oznaka">Ukupno prijema</div>
      <div class="stat-vrednost" id="statUkupno">—</div>
    </div>
    <div class="stat-kartica">
      <div class="stat-oznaka">Novi</div>
      <div class="stat-vrednost" id="statNovi">—</div>
      <div class="stat-delta" id="statNoviDelta"></div>
    </div>
    <div class="stat-kartica">
      <div class="stat-oznaka">Zakazano</div>
      <div class="stat-vrednost" id="statZakazano">—</div>
    </div>
    <div class="stat-kartica">
      <div class="stat-oznaka">Visoka urgentnost</div>
      <div class="stat-vrednost" id="statUrgentno">—</div>
    </div>
  </div>

  <!-- Tabela prijema -->
  <div class="tabela-kartica">
    <div class="tabela-zaglavlje">
      <div class="tabela-naslov">Prijemi klijenata</div>
      <div class="tabela-broj" id="tabelaBroj"></div>
    </div>
    <div id="tabelaSadrzaj">
      <div class="ucitavanje">Učitavanje prijema...</div>
    </div>
  </div>

</div>

<div class="modal-pozadina" id="modalPozadina" onclick="zatvoriModal(event)">
  <div class="modal" id="modal">
    <div class="modal-zaglavlje">
      <div class="modal-naslov" id="modalNaslov">Detalji prijema</div>
      <button class="dugme-zatvori" onclick="zatvoriModalDugme()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-telo" id="modalTelo">
      Učitavanje...
    </div>
  </div>
</div>

<script src="../js/zajednicko.js"></script>
<script>
  zahtevajPrijavu();

  let sviPrijemi = [];
  let trenutniPrijemId = null;
  let tajmerOsvezavanja = null;

  function formatujDatum(iso) {
    const d = new Date(iso.endsWith('Z') ? iso : iso + 'Z');  // server šalje UTC
    return d.toLocaleDateString('sr-RS', { day: '2-digit', month: '2-digit', year: 'numeric' })
      + ' · ' + d.toLocaleTimeString('sr-RS', { hour: '2-digit', minute: '2-digit' });
  }

  function oznakaStatusa(status) {
    const mapa = {
      novi: ['Novi', 'status-novi'],
      na_pregledu: ['Na pregledu', 'status-na_pregledu'],
      zakazano: ['Zakazano', 'status-zakazano'],
      zatvoreno: ['Zatvoreno', 'status-zatvoreno']
    };
    const [tekst, klasa] = mapa[status] || ['Nepoznat', ''];
    return `<span class="oznaka-status ${klasa}">${tekst}</span>`;
  }

  function oznakaUrgentnosti(p) {
    if (p.analiza_status === 'u_obradi') return '<span class="oznaka-analiza">Analiza u toku…</span>';
    if (p.analiza_status === 'neuspesna') return '<span class="oznaka-analiza">Analiza nije uspela</span>';
    const mapa = {
      visoka: 'urgentnost-visoka',
      srednja: 'urgentnost-srednja',
      niska: 'urgentnost-niska'
    };
    const u = p.procena_urgentnosti;
    if (!mapa[u]) return '—';
    return `<span class="oznaka-urgentnost ${mapa[u]}">${u.charAt(0).toUpperCase() + u.slice(1)}</span>`;
  }

  // ── Pretplata ──
  async function ucitajProfil() {
    try {
      const odg = await apiAdvokat('/auth/ja');
      if (!odg.ok) return;
      const ja = await odg.json();
      localStorage.setItem('lex_ime', ja.ime);
      document.getElementById('navInfo').textContent = ja.ime;

      const traka = document.getElementById('trakaPretplate');
      const tekst = document.getElementById('trakaTekst');
      traka.classList.remove('vidljivo', 'istekla');

      if (ja.status_pretplate === 'probni_period' && ja.datum_isteka_probe) {
        const dana = Math.max(0, Math.ceil((new Date(ja.datum_isteka_probe + 'Z') - new Date()) / 86400000));
        tekst.textContent = `Probni period ističe za ${dana} ${dana === 1 ? 'dan' : 'dana'}. Izaberite plan da biste nastavili da primate klijente.`;
        traka.classList.add('vidljivo');
      } else if (ja.status_pretplate === 'istekla') {
        tekst.textContent = 'Vaša pretplata je istekla - upitnik trenutno ne prima nove klijente.';
        traka.classList.add('vidljivo', 'istekla');
      } else if (ja.status_pretplate === 'otkazana' && ja.datum_isteka_pretplate) {
        tekst.textContent = `Pretplata je otkazana i važi do ${new Date(ja.datum_isteka_pretplate + 'Z').toLocaleDateString('sr-RS')}.`;
        traka.classList.add('vidljivo');
      } else if (ja.limit_prijema_mesecno && ja.prijema_ovog_meseca >= ja.limit_prijema_mesecno) {
        tekst.textContent = `Iskoristili ste ${ja.limit_prijema_mesecno} prijema ovog meseca. Pređite na Pro plan za neograničen broj.`;
        traka.classList.add('vidljivo');
      }
    } catch (e) {}
  }

  // ── Učitavanje ──
  async function ucitajPrijeme() {
    try {
      const odg = await apiAdvokat('/prijem/lista');
      if (!odg.ok) throw new Error();
      sviPrijemi = await odg.json();
      prikaziTabelu();
      prikaziStatistike();

      // Dok se neka analiza obrađuje, tabla se sama osvežava
      clearTimeout(tajmerOsvezavanja);
      if (sviPrijemi.some(p => p.analiza_status === 'u_obradi')) {
        tajmerOsvezavanja = setTimeout(ucitajPrijeme, 8000);
      }
    } catch (e) {
      document.getElementById('tabelaSadrzaj').innerHTML =
        '<div class="ucitavanje">Greška pri učitavanju. Server se možda budi - osvežite stranicu za minut.</div>';
    }
  }

  function prikaziStatistike() {
    const ukupno = sviPrijemi.length;
    const novi = sviPrijemi.filter(p => p.status === 'novi').length;
    const zakazano = sviPrijemi.filter(p => p.status === 'zakazano').length;
    const urgentno = sviPrijemi.filter(p => p.procena_urgentnosti === 'visoka').length;

    document.getElementById('statUkupno').textContent = ukupno;
    document.getElementById('statNovi').textContent = novi;
    document.getElementById('statZakazano').textContent = zakazano;
    document.getElementById('statUrgentno').textContent = urgentno;
    document.getElementById('navInfo').textContent = localStorage.getItem('lex_ime') || '';
    document.getElementById('statNoviDelta').textContent = novi > 0 ? `${novi} čeka odgovor` : '';
  }

  function prikaziTabelu() {
    const el = document.getElementById('tabelaSadrzaj');
    document.getElementById('tabelaBroj').textContent =
      `${sviPrijemi.length} ${sviPrijemi.length === 1 ? 'prijem' : 'prijema'}`;

    if (sviPrijemi.length === 0) {
      el.innerHTML = `
        <div class="prazno">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <p>Još uvek nema prijema klijenata. Link za upitnik pronađite u <a href="podesavanja.html">Podešavanjima</a>.</p>
        </div>`;
      return;
    }

    el.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Klijent</th>
            <th>Oblast prava</th>
            <th>Datum</th>
            <th>Status</th>
            <th>Urgentnost</th>
            <th>Vodi</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${sviPrijemi.map(p => `
            <tr onclick="otvoriModal(${Number(p.id)})">
              <td>
                <span class="klijent-ime">${esc(p.klijent_ime || 'Nepoznat')}</span>
                <span class="klijent-kontakt">${esc(p.klijent_email || p.klijent_telefon || '—')}</span>
              </td>
              <td>${esc(p.oblast_prava || '—')}</td>
              <td>${formatujDatum(p.datum_prijema)}</td>
              <td>${oznakaStatusa(p.status)}</td>
              <td>${oznakaUrgentnosti(p)}</td>
              <td>${esc(p.dodeljen_ime || '—')}</td>
              <td><button class="dugme-pregled" onclick="event.stopPropagation();otvoriModal(${Number(p.id)})">Pregled</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }

  function polje(oznaka, vrednost, puno = false) {
    return `<div class="polje${puno ? ' puno' : ''}"><span class="polje-oznaka">${oznaka}</span><span class="polje-vrednost">${escRedovi(vrednost || '—')}</span></div>`;
  }

  async function otvoriModal(prijem_id) {
    trenutniPrijemId = prijem_id;
    document.getElementById('modalPozadina').classList.add('vidljivo');
    document.getElementById('modalTelo').innerHTML = '<div class="ucitavanje">Učitavanje...</div>';

    try {
      const odg = await apiAdvokat(`/prijem/detalji/${prijem_id}`);
      if (!odg.ok) throw new Error();
      const p = await odg.json();

      document.getElementById('modalNaslov').textContent = p.klijent_ime || 'Detalji prijema';

      const urgentnost = ['visoka', 'srednja', 'niska'].includes(p.procena_urgentnosti) ? p.procena_urgentnosti : null;
      const sirinaTrake = {visoka: '85%', srednja: '50%', niska: '20%'}[urgentnost] || '0%';

      let analizaHtml;
      if (p.analiza_status === 'u_obradi') {
        analizaHtml = '<div class="ai-blok">Analiza je u toku - osvežite za koji trenutak.</div>';
      } else if (p.analiza_status === 'neuspesna') {
        analizaHtml = `<div class="ai-blok">Analiza nije uspela. Transkript razgovora je sačuvan ispod.</div>
          <button class="dugme-sacuvaj" style="margin-top:10px" onclick="ponoviAnalizu()">Pokreni analizu ponovo</button>`;
      } else {
        analizaHtml = `
          <div class="ai-blok">${escRedovi(p.ai_analiza || 'Analiza nije dostupna.')}</div>
          <div class="ai-napomena">AI predlog na osnovu razgovora - proverite pre upotrebe; nije pravni savet.</div>
          <div class="polje puno" style="margin-top:10px">
            <span class="polje-oznaka">Preporučeni koraci</span>
            <span class="polje-vrednost">${escRedovi(p.preporuceni_koraci || '—')}</span>
          </div>
          <div class="urgentnost-traka">
            <span class="traka-oznaka">Urgentnost:</span>
            <div class="traka-pozadina"><div class="traka-punjenje" style="width:${sirinaTrake}"></div></div>
            <span class="traka-vrednost traka-${urgentnost || 'srednja'}">${urgentnost ? urgentnost.charAt(0).toUpperCase() + urgentnost.slice(1) : '—'}</span>
          </div>`;
      }

      const transkript = (p.razgovor || []).map(r =>
        `<div class="transkript-poruka ${r.role === 'user' ? 'user' : 'assistant'}">${escRedovi(r.content)}</div>`
      ).join('');

      document.getElementById('modalTelo').innerHTML = `
        <div class="sekcija-razmak">
          <div class="sekcija-oznaka">Kontakt podaci</div>
          <div class="polje-red">
            ${polje('Ime i prezime', p.klijent_ime)}
            ${polje('Telefon', p.klijent_telefon)}
            ${polje('Email', p.klijent_email)}
            ${polje('Datum prijema', formatujDatum(p.datum_prijema))}
          </div>
        </div>

        <div class="sekcija-razmak">
          <div class="sekcija-oznaka">Slučaj</div>
          <div class="polje-red">
            <div class="polje"><span class="polje-oznaka">Oblast prava</span><span class="polje-vrednost" style="font-weight:500;color:#0f2744">${esc(p.oblast_prava || '—')}</span></div>
            <div class="polje"><span class="polje-oznaka">Status</span><span class="polje-vrednost">${oznakaStatusa(p.status)}</span></div>
            ${polje('Opis problema', p.opis_problema, true)}
            ${polje('Detalji', p.detalji_slucaja, true)}
            ${polje('Dokumenti', p.dokumenti_napomena, true)}
          </div>
        </div>

        <div class="sekcija-razmak">
          <div class="sekcija-oznaka">AI analiza</div>
          ${analizaHtml}
        </div>

        ${transkript ? `
        <details class="sekcija-razmak">
          <summary class="sekcija-oznaka">Transkript razgovora</summary>
          <div class="transkript">${transkript}</div>
        </details>` : ''}

        ${(p.tim || []).length > 1 ? `
        <div class="sekcija-razmak">
          <div class="sekcija-oznaka">Prijem vodi</div>
          <select class="status-izbornik" id="dodelaIzbornik" onchange="dodeliPrijem()">
            <option value="">— niko —</option>
            ${p.tim.map(a => `<option value="${Number(a.id)}" ${a.id === p.dodeljen_id ? 'selected' : ''}>${esc(a.ime)}</option>`).join('')}
          </select>
        </div>` : ''}

        <div class="sekcija-razmak">
          <div class="sekcija-oznaka">Promena statusa</div>
          <select class="status-izbornik" id="statusIzbornik">
            <option value="novi" ${p.status === 'novi' ? 'selected' : ''}>Novi</option>
            <option value="na_pregledu" ${p.status === 'na_pregledu' ? 'selected' : ''}>Na pregledu</option>
            <option value="zakazano" ${p.status === 'zakazano' ? 'selected' : ''}>Zakazano</option>
            <option value="zatvoreno" ${p.status === 'zatvoreno' ? 'selected' : ''}>Zatvoreno</option>
          </select>
          <button class="dugme-sacuvaj" onclick="sacuvajStatus()">Sačuvaj status</button>
          <button class="dugme-pdf" id="dugmePdf" onclick="preuzmiPdf()">Preuzmi PDF izveštaj</button>
          <button class="dugme-obrisi" onclick="obrisiPrijem()">Trajno obriši prijem</button>
        </div>
      `;
    } catch (e) {
      document.getElementById('modalTelo').innerHTML = '<div class="ucitavanje">Greška pri učitavanju detalja.</div>';
    }
  }

  async function sacuvajStatus() {
    const status = document.getElementById('statusIzbornik').value;
    try {
      const odg = await apiAdvokat(`/prijem/status/${trenutniPrijemId}`, {
        method: 'PATCH',
        body: JSON.stringify({ status })
      });
      if (!odg.ok) throw new Error();
      await ucitajPrijeme();
      zatvoriModalDugme();
    } catch (e) {
      alert('Greška pri čuvanju statusa.');
    }
  }

  async function dodeliPrijem() {
    const vrednost = document.getElementById('dodelaIzbornik').value;
    try {
      const odg = await apiAdvokat(`/prijem/dodeli/${trenutniPrijemId}`, {
        method: 'PATCH',
        body: JSON.stringify({ advokat_id: vrednost ? Number(vrednost) : null })
      });
      if (!odg.ok) throw new Error();
      await ucitajPrijeme();
    } catch (e) {
      alert('Greška pri dodeli prijema.');
    }
  }

  async function obrisiPrijem() {
    if (!confirm('Prijem i ceo razgovor biće trajno obrisani. Nastaviti?')) return;
    try {
      const odg = await apiAdvokat(`/prijem/${trenutniPrijemId}`, { method: 'DELETE' });
      if (!odg.ok) throw new Error();
      zatvoriModalDugme();
      await ucitajPrijeme();
    } catch (e) {
      alert('Greška pri brisanju prijema.');
    }
  }

  async function ponoviAnalizu() {
    try {
      const odg = await apiAdvokat(`/prijem/analiza/${trenutniPrijemId}`, { method: 'POST' });
      if (!odg.ok) {
        alert(porukaGreske(await odg.json(), 'Analiza nije pokrenuta.'));
        return;
      }
      zatvoriModalDugme();
      await ucitajPrijeme();
    } catch (e) {
      alert('Analiza nije pokrenuta.');
    }
  }

  // PDF se preuzima preko fetch-a jer ruta zahteva token
  async function preuzmiPdf() {
    if (!trenutniPrijemId) return;
    const dugme = document.getElementById('dugmePdf');
    dugme.disabled = true;
    dugme.textContent = 'Priprema PDF-a...';
    try {
      const odg = await apiAdvokat(`/prijem/pdf/${trenutniPrijemId}`);
      if (!odg.ok) throw new Error();
      const blob = await odg.blob();
      const ime = (odg.headers.get('Content-Disposition') || '').match(/filename="?([^"]+)"?/);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = ime ? ime[1] : `prijem_${trenutniPrijemId}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    } catch (e) {
      alert('Greška pri preuzimanju PDF-a.');
    } finally {
      dugme.disabled = false;
      dugme.textContent = 'Preuzmi PDF izveštaj';
    }
  }

  function zatvoriModal(e) {
    if (e.target === document.getElementById('modalPozadina')) {
      zatvoriModalDugme();
    }
  }

  function zatvoriModalDugme() {
    document.getElementById('modalPozadina').classList.remove('vidljivo');
    trenutniPrijemId = null;
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') zatvoriModalDugme();
  });

  ucitajProfil();
  ucitajPrijeme().then(() => {
    // Link iz mejla: tabla.html?prijem=ID otvara taj prijem
    const izMejla = new URLSearchParams(window.location.search).get('prijem');
    if (izMejla && /^\d+$/.test(izMejla)) otvoriModal(Number(izMejla));
  });
</script>
</body>
</html>
