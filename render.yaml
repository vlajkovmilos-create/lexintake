services:
  - type: web
    name: lexintake-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /zdravlje
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: LexIntake <obavestenja@lex.vlajkov.rs>
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-5-5
      - key: FRONTEND_URL
        value: https://vlajkovmilos-create.github.io/lexintake
      - key: CORS_ORIGINI
        value: https://vlajkovmilos-create.github.io
